# Split hosting where nginx serves the built frontend itself and proxies /api to the Node process.
# Keeping /api on the same origin means no CORS and no cross-site cookie settings are needed.
server {
    listen 80;
    server_name academy.example.com;

    root /var/www/academy;          # copy frontend/dist/* here
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;   # single-page-app fallback
    }
}
