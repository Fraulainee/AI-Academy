# Reverse proxy in front of the Node process (single-origin hosting).
# Install: copy to /etc/nginx/sites-available/academy, symlink into sites-enabled, then
#   sudo certbot --nginx -d academy.example.com     (adds the HTTPS listener + redirects)
server {
    listen 80;
    server_name academy.example.com;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
